name: "Terraform Enterprise CI/CD Pipeline"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to Execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ============================================================================
  # 1. AUTO CREATE PR (On feature branch push)
  # ============================================================================
  auto-create-pr:
    name: "Auto Create PR"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: master
          title: "🚀 Deploy Infrastructure: ${{ github.ref_name }}"
          body: |
            ## 🏗️ Automated Infrastructure Pull Request
            This PR was automatically generated by pushing to branch `${{ github.ref_name }}`.

            ### 🧪 Automated CI Pipeline Checks:
            - [x] Syntax & Format Validation (`terraform fmt & validate`)
            - [x] Security Vulnerability & Compliance Scan (`tfsec`)
            - [x] Speculative Infrastructure Plan (`terraform plan`)

            *Review the automated plan in the comments below, then approve and merge to deploy.*
          draft: false

  # ============================================================================
  # 2. LINT, SECURITY SCAN & SPECULATIVE PLAN (On PR)
  # ============================================================================
  terraform-plan:
    name: "Terraform Security Scan & Plan"
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'plan')
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (S3 Remote Backend)
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Security Vulnerability Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Terraform Speculative Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Render Plan Summary
        id: show_plan
        run: |
          terraform show -no-color tfplan > plan.txt
          echo "PLAN_TEXT<<EOF" >> $GITHUB_ENV
          head -n 250 plan.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Plan Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('terraform/plan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n\n... [Output truncated for GitHub comment limit]';
              }
            } catch (e) {
              planOutput = 'Error reading plan file';
            }

            const body = `### 📖 Terraform Speculative Plan Output
            <details><summary>Click to Expand Plan Details</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }} | Event: \`${{ github.event_name }}\` | Remote Backend: \`S3 + DynamoDB\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # 3. TERRAFORM APPLY (On PR Merge to Master)
  # ============================================================================
  terraform-apply:
    name: "Terraform Apply (Deploy)"
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Capture Outputs
        id: tf_outputs
        run: |
          terraform output -json > outputs.json
          cat outputs.json

      - name: Post Apply Outputs on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let outputText = '### 🎉 Terraform Apply Completed Successfully! ✅\n\n';
            try {
              const raw = fs.readFileSync('terraform/outputs.json', 'utf8');
              const data = JSON.parse(raw);
              outputText += '| Output Key | Value |\n| :--- | :--- |\n';
              for (const [key, obj] of Object.entries(data)) {
                outputText += `| **${key}** | \`${obj.value}\` |\n`;
              }
            } catch (e) {
              outputText += 'Infrastructure deployed successfully.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: outputText
            });

  # ============================================================================
  # 4. TERRAFORM DESTROY (On Manual Workflow Dispatch)
  # ============================================================================
  terraform-destroy:
    name: "Terraform Destroy (Manual Teardown)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'destroy'
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
